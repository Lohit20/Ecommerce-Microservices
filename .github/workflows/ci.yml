name: CI — Build, Deploy & Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Docker Buildx (enables layer caching) ───────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Create .env for docker-compose ─────────────────────────────────
      - name: Create environment file
        run: |
          cat <<EOF > .env
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY || 'ci-test-secret-key-not-for-production' }}
          HF_API_TOKEN=${{ secrets.HF_API_TOKEN }}
          EOF

      # ── 4. Build and start all services ───────────────────────────────────
      - name: Build and start services
        run: docker compose up --build -d

      # ── 5. Wait for the stack to be fully ready ────────────────────────────
      #       Poll the gateway until the Products endpoint responds.
      #       This confirms MongoDB is healthy, seed ran, products service is
      #       up, and Nginx is routing correctly — all in one check.
      - name: Wait for services to be ready
        run: |
          echo "Waiting for all services to be ready..."
          timeout 180 bash -c '
            until curl -sf http://localhost:3000/api/products/get_all_products/ > /dev/null 2>&1; do
              echo "  Not ready yet — retrying in 5s..."
              sleep 5
            done
          '
          echo "All services are ready."

      # ── 6. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      # ── 7. Install test dependencies ──────────────────────────────────────
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      # ── 8. Run integration tests ──────────────────────────────────────────
      - name: Run integration tests
        run: pytest tests/ -v --tb=short

      # ── 9. Print service logs on failure ──────────────────────────────────
      - name: Show service logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      # ── 10. Tear down all containers and volumes ───────────────────────────
      - name: Tear down
        if: always()
        run: docker compose down -v
