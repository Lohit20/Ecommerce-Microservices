services:

  # ── MongoDB ──────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ecommerce_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Seed — runs once, seeds 685 products, then exits ─────────────────────
  seed:
    build:
      context: .
      dockerfile: mongo-init/Dockerfile
    container_name: seed
    environment:
      - MONGO_URI=mongodb://mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ecommerce_network
    restart: "no"

  # ── Products service ──────────────────────────────────────────────────────
  products_service:
    build:
      context: ./products
      dockerfile: Dockerfile
    container_name: products_service
    ports:
      - "8001:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-supersecretkey_changeme_in_production}
      - ALGORITHM=HS256
    depends_on:
      mongodb:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    networks:
      - ecommerce_network
    restart: unless-stopped

  # ── Cart service ──────────────────────────────────────────────────────────
  cart_service:
    build:
      context: ./cart
      dockerfile: Dockerfile
    container_name: cart_service
    ports:
      - "8002:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - PRODUCTS_SERVICE_URL=http://products_service:8000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-supersecretkey_changeme_in_production}
      - ALGORITHM=HS256
    depends_on:
      mongodb:
        condition: service_healthy
      products_service:
        condition: service_started
    networks:
      - ecommerce_network
    restart: unless-stopped

  # ── Recommendation & Search service ──────────────────────────────────────
  recommendation_service:
    build:
      context: ./recommendation_and_search_system
      dockerfile: Dockerfile
    container_name: recommendation_service
    ports:
      - "8003:8000"
    environment:
      - HF_API_TOKEN=${HF_API_TOKEN:-}
      - PRODUCTS_SERVICE_URL=http://products_service:8000
    depends_on:
      products_service:
        condition: service_started
    networks:
      - ecommerce_network
    restart: unless-stopped

  # ── Auth service ──────────────────────────────────────────────────────────
  auth_service:
    build:
      context: ./ecommerce-auth
      dockerfile: Dockerfile
    container_name: auth_service
    ports:
      - "8004:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-supersecretkey_changeme_in_production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ecommerce_network
    restart: unless-stopped

  # ── Frontend (React → nginx) ──────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - products_service
      - cart_service
      - recommendation_service
      - auth_service
    networks:
      - ecommerce_network
    restart: unless-stopped

# ── Shared network ────────────────────────────────────────────────────────
networks:
  ecommerce_network:
    driver: bridge

# ── Persistent volume for MongoDB data ───────────────────────────────────
volumes:
  mongo_data:
